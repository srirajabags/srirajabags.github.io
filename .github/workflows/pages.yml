name: Deploy Pages

on:
  push:
    branches: [main]
  # "Run workflow" in the Actions tab is how Grist catalog edits are
  # published: it syncs the catalog, commits it and deploys.
  workflow_dispatch:

permissions:
  # write: the catalog sync commits what it pulled from Grist back to main, so
  # every price change is in git history and the next build starts from it.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every actions/* below is pinned to a major that runs on Node 24.
      # Node 20 was deprecated on the runners in Sept 2025 and the older majors
      # now emit a warning on every run:
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone: enableGitInfo reads
          # each file's last commit date to build sitemap <lastmod>.
          fetch-depth: 0

      # The catalog lives in Grist. Pull it into site/assets/data/catalog.json
      # and site/assets/images/catalog/ before building, so the page is static
      # HTML with every product and rate in it. If Grist cannot be reached, the
      # build carries on with the catalog last committed — a stale price list
      # beats no catalog — and the run is flagged with a warning.
      - name: Sync catalog from Grist
        id: sync
        continue-on-error: true
        env:
          GRIST_URL: ${{ secrets.GRIST_URL }}
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
          GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
        run: |
          npm ci --prefix scripts/catalog --no-audit --no-fund
          node scripts/catalog/sync-from-grist.mjs

      - name: Warn if the sync failed
        if: steps.sync.outcome == 'failure'
        run: echo "::warning::Catalog sync from Grist failed; building with the last committed catalog."

      # Only main is written to: a sync on any other ref is used for that build
      # and thrown away. A push made with GITHUB_TOKEN does not start another
      # run, so this cannot loop.
      - name: Commit catalog changes
        id: commit
        if: steps.sync.outcome == 'success' && github.ref == 'refs/heads/main'
        run: |
          git add -A site/assets/data/catalog.json site/assets/images/catalog
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
            exit 0
          fi
          # Whatever happens to the push, this build has the new catalog in its
          # working tree and deploys it.
          git -c user.name="github-actions[bot]" -c user.email="41898182+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Sync catalog from Grist"
          git show --stat --format='%h %s' HEAD
          # main may have moved while this ran; the sync only touches its own
          # files, so replaying it on top is always clean.
          if ! { git pull -q --rebase origin main && git push -q origin HEAD:main; }; then
            echo "::warning::Could not push the catalog sync to main (is main protected?). This deploy has it; git history does not."
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.140.2"
          extended: true

      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: site/resources
          key: hugo-resources-${{ hashFiles('site/assets/images/**') }}
          restore-keys: hugo-resources-

      - name: Build site
        run: hugo --source site --minify --destination ../_site

      - name: Add CNAME
        run: cp CNAME _site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Tell IndexNow the site changed, so Bing (and therefore Copilot), Yandex,
      # Seznam and Naver recrawl in hours instead of whenever they next wander
      # past. Google does not participate in IndexNow — Search Console is the
      # only lever there, and it needs a human to verify the property once.
      #
      # The key is published at /<key>.txt from site/static/, which is how the
      # endpoint proves the request came from someone who controls the domain.
      # Never fail the deploy over this: the site is already live by now, and a
      # missed ping only costs a slower recrawl.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          KEY: 01c1e7960107c43c2d1c0cce22f7ab8b
        run: |
          urls=$(curl -sS --fail https://www.srirajabags.in/sitemap.xml \
                 | grep -o '<loc>[^<]*</loc>' | sed 's|</\?loc>||g')
          echo "Submitting $(echo "$urls" | wc -l) URLs"
          payload=$(jq -n --arg host www.srirajabags.in --arg key "$KEY" \
            --arg loc "https://www.srirajabags.in/$KEY.txt" \
            --argjson list "$(echo "$urls" | jq -R . | jq -s .)" \
            '{host:$host, key:$key, keyLocation:$loc, urlList:$list}')
          code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload")
          echo "IndexNow responded $code"
          cat /tmp/indexnow.out || true
          # 200 accepted, 202 accepted pending key validation. Anything else is
          # informational only — see the body above.
          case "$code" in 200|202) echo "ok" ;; *) echo "not accepted (non-fatal)" ;; esac
