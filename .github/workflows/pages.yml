name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every actions/* below is pinned to a major that runs on Node 24.
      # Node 20 was deprecated on the runners in Sept 2025 and the older majors
      # now emit a warning on every run:
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone: enableGitInfo reads
          # each file's last commit date to build sitemap <lastmod>.
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.140.2"
          extended: true

      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: site/resources
          key: hugo-resources-${{ hashFiles('site/assets/images/**') }}
          restore-keys: hugo-resources-

      - name: Build site
        run: hugo --source site --minify --destination ../_site

      - name: Add CNAME
        run: cp CNAME _site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
