baseURL = "https://www.srirajabags.in/"
languageCode = "en-in"
title = "Sri Raja Bags"
enableRobotsTXT = true
# Makes .Lastmod the file's last git commit date, so sitemap <lastmod> stays
# true on its own. Without it none of the dateless pages (/catalog/, /about/)
# emit one at all. Requires the full history at build time — the deploy
# workflow sets fetch-depth: 0 for exactly this reason.
enableGitInfo = true
# No tag/category archive pages yet — re-enable by removing this and adding
# layouts/_default/{taxonomy,term}.html
disableKinds = ["taxonomy", "term"]

[params]
  # Homepage <title>. "Sri Raja Bags" alone matches nothing buyers actually
  # search for — the product term and the district have to be in here.
  homeTitle = "Non Woven Carry Bag Manufacturers in Kurnool, AP · Sri Raja Bags"
  # Dhone moved from Kurnool to Nandyal district in the 2022 reorganisation.
  # The district appears in prose only — the postal address and schema omit it,
  # because the Google Business Profile shows "Dhone, Andhra Pradesh 518222"
  # with no district and the NAP has to match that exactly. "Kurnool" stays in
  # the title and here because it is still what buyers in this region search.
  description = "Manufacturers of non-woven carry bags and plastic covers since 2011. Based at Dhone, Nandyal district near Kurnool, Andhra Pradesh. Supplying AP, Telangana and Karnataka."
  phone = "+91 91770 56061"
  phoneRaw = "919177056061"
  email = "dhoneaswinibags@gmail.com"
  # Source image for og:image / twitter:image social preview cards.
  # The production line: native 16:9 so it crops to 1200x630 with no upscaling,
  # and shows people actually making bags — the strongest "real manufacturer" signal.
  ogImage = "images/factory-production-line.jpg"
  foundingYear = "2011"

  # "Sri Raja Bags" is the brand the three registered units trade under. There
  # is no single legal name, so the schema carries the brand as `name` and lists
  # these as related organisations rather than claiming one of them as THE
  # legal entity.
  legalEntities = ["Sai Polymers", "Aswini Bags", "Sri Raja Plastic Industries"]

  # Published as schema legalName + taxID. Checksum-validated; state 37 = AP.
  #
  # CAVEAT: Sai Polymers is GST-registered at the factory (479/A1, Dorapally
  # Road), but the Google Business Profile is verified at the office (9/74-1,
  # Kothapeta) — which is the Udyam address, not this one. So the entity named
  # here is not the one registered at the address the schema now carries.
  # Harmless for ranking, but revisit once the Udyam question is settled.
  registeredEntity = "Sai Polymers"
  gstin = "37BYPPR4050M1ZP"

  gtag = "G-PEF5RMYG3G"
  instagram = "https://www.instagram.com/srirajabags"
  facebook = "https://www.facebook.com/srirajabags"
  # Verified Google Business Profile, added to schema sameAs to tie this site's
  # entity to the listing. This is the canonical ?cid= form rather than a
  # share.google/ shortlink: it resolves in one hop and carries no session
  # tracking. 6670143212572038284 is CID 0x5c911be97256d48c, the same place ID
  # as the map embed below.
  googleProfile = "https://www.google.com/maps?cid=6670143212572038284"

  # Direct "write a review" link from the profile. Its token decodes to the same
  # CID, so all three references point at one listing.
  reviewLink = "https://g.page/r/CYzUVnLpG5FcEBM/review"

# Canonical NAP. The Google Business Profile is registered at the office, so
# `primary` points there — the schema address and the profile have to agree
# character for character or the two signals compete. The factory is still
# shown on the page; it is just not the address Google matches against.
#
# Note: these tables must stay last in [params] — any plain key written after a
# TOML sub-table gets absorbed into that sub-table.
[params.address]
  primary = "office"
  region = "Andhra Pradesh"
  country = "IN"

  # Manufacturing unit — the GST-registered principal place of business.
  # 15.3993/77.8585 is the pin the old Maps embed used: "Dhone Rural", between
  # Dorapalli village and Dhone town, so it reads as the factory side.
  [params.address.factory]
    label = "Factory"
    streetAddress = "479/A1, Dorapally Road"
    locality = "Dhone"
    postalCode = "518222"
    latitude = 15.399339
    longitude = 77.858502

  # Office — the address the Google Business Profile is verified at, so this
  # string must stay identical to what the profile shows.
  # GBP store code 03454079842909153724.
  # Coordinates come from the verified profile's own embed, so the pin, the
  # map and the listing all trace to one source. (An earlier value taken from
  # the postal-address record sat 47 m away.)
  #
  # mapEmbed: optional. Paste the src URL from Google Maps → Share → Embed a map
  # on the VERIFIED BUSINESS PROFILE (not the postal address entity — they are
  # different records). With it, the map shows the business card and, once
  # reviews exist, the star rating. Without it, the map falls back to a plain
  # coordinate pin, so clearing this string is always a safe rollback.
  [params.address.office]
    label = "Office"
    streetAddress = "9/74-1, KVS Colony, Kothapeta"
    locality = "Dhone"
    postalCode = "518222"
    latitude = 15.3976443
    longitude = 77.8750319
    mapEmbed = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d264.4537360613112!2d77.87503186540425!3d15.397644281347027!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bb6811f3ccc2d4b%3A0x5c911be97256d48c!2sSri%20Raja%20Bags!5e0!3m2!1sen!2sin!4v1786679451089!5m2!1sen!2sin"

[permalinks]
  blog = "/blog/:year/:month/:day/:slug/"

[outputs]
  home = ["HTML"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"

[markup.goldmark.renderer]
  unsafe = false

[imaging]
  quality = 82
  resampleFilter = "Lanczos"

# Statutory registrations, each tied to the entity that actually holds it.
# Different units have different proprietors, so the About page labels every
# number with its owner rather than implying one registrant covers the brand.
#
# The Udyam registration is deliberately withheld: its certificate names a
# different proprietor and PAN than the GST record, and until that is resolved
# publishing it would point a buyer who verified it at the wrong entity.
# Trade names are spelled exactly as they appear on each certificate, since a
# buyer checking a number against the GST portal is matching these strings.
# All three checksum-validate; all are proprietorships registered 01/07/2017.
[[params.registrations]]
  entity = "Sai Polymers"
  label = "GSTIN"
  number = "37BYPPR4050M1ZP"

[[params.registrations]]
  entity = "Aswinibags"
  label = "GSTIN"
  number = "37AZSPR9190H1ZD"

[[params.registrations]]
  entity = "Sri Raja Plastic Industries"
  label = "GSTIN"
  number = "37AAPPR5458Q1ZH"
